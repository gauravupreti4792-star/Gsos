# GSOS Calamares settings (starter config for an archiso live system)
---
modules-search: [ local ]

instances:
  - id: gsos-prep
    module: shellprocess
    config: shellprocess-gsos-prep.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - networkcfg
      - hwclock
      - initcpio
      - grubcfg
      - shellprocess@gsos-prep
      - bootloader
      - umount
  - show:
      - finished

branding: default
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
quit-at-end: false
