---
defaultGroups: [ users, wheel, video, audio, input, storage, optical, network ]
autologinGroup: autologin
doAutologin: false
sudoersGroup: wheel
setRootPassword: false
doReusePassword: false
availableShells: /bin/bash
userShell: /bin/bash
avatarFilePath: ~/.face
passwordRequirements:
  minLength: -1
  maxLength: -1
